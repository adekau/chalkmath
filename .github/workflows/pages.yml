name: Deploy ChalkMath to GitHub Pages

# Builds the notebook — the Lean engine compiled to WebAssembly, then the static page — and publishes
# apps/notebook/dist. It runs after CI (ci.yml) completes on main, and deploys only the commit CI
# passed on, so a change that breaks the engine's tests never reaches the public notebook. The wasm
# runtime (Lean's runtime + Init for wasm32, built from source by scripts/build-lean-wasm-runtime.sh)
# is cached between runs; the first run takes ~15 minutes.
# One-time setup on the repository: Settings › Pages › Source: "GitHub Actions".

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # a manual run deploys the branch it was started on; an automatic one only a commit CI passed
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install elan (the Lean toolchain pinned in engine/lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: latest, actions-cache-folder: emsdk-cache }
      - name: Cache the wasm runtime and the engine build
        uses: actions/cache@v4
        with:
          path: |
            engine/toolchains
            engine/.lake
          key: wasm-${{ hashFiles('engine/lean-toolchain', 'engine/wasm/**', 'scripts/build-lean-wasm-runtime.sh') }}-${{ hashFiles('engine/**/*.lean') }}
          restore-keys: |
            wasm-${{ hashFiles('engine/lean-toolchain', 'engine/wasm/**', 'scripts/build-lean-wasm-runtime.sh') }}-
      - run: npm ci
      - name: Install the pinned Lean toolchain and show the tool versions
        run: |
          elan toolchain install "$(cat engine/lean-toolchain)"
          (cd engine && lean --version && lake --version)
          emcc --version | head -1
          nproc
      - name: Build the engine for wasm
        run: npm run wasm
      - name: Smoke-test the wasm engine (load, capabilities, one evaluation)
        run: node scripts/smoke-wasm.cjs apps/notebook/dist
      - name: Build the workspace packages, then bundle the notebook
        run: |
          npm run build
          npm run bundle
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/notebook/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
