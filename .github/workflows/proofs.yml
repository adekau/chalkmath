name: Proofs

# Builds proofs/: the rules' soundness theorems over ℝ and ℂ, against Mathlib. Runs when the engine
# or the proofs change, since an engine change can break a theorem about it. `lake exe cache get`
# fetches Mathlib's prebuilt oleans (~5 GB); building Mathlib from source would take hours.

on:
  push:
    branches: [main]
    paths: ["engine/**", "proofs/**", ".github/workflows/proofs.yml"]
  pull_request:
    paths: ["engine/**", "proofs/**", ".github/workflows/proofs.yml"]
  workflow_dispatch:

concurrency:
  group: proofs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (the Lean toolchain pinned in proofs/lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The two packages share one toolchain
        run: diff engine/lean-toolchain proofs/lean-toolchain
      - name: Fetch Mathlib's prebuilt oleans, then build the theorems
        working-directory: proofs
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          lake build
