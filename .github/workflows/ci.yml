name: CI

# What a change must pass before it reaches the public notebook: the Lean engine builds and passes
# `lake test` (the ported reference suite and the golden corpus), engine/ stays free of Mathlib, the
# TypeScript packages build and pass their tests against the native engine, the notebook page
# type-checks and bundles, and math cells typed into the bundled page in Chromium show the native
# engine's answers and work, as do the notebook's teaching features (scripts/e2e-math.mjs). pages.yml deploys a main commit only after this has passed on it.

on:
  push:
    branches: [main]
    paths-ignore: ["book/**", "design/**", "**/*.md"]
  pull_request:
    paths-ignore: ["book/**", "design/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install elan (the Lean toolchain pinned in engine/lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache the engine build
        uses: actions/cache@v4
        with:
          path: engine/.lake
          key: engine-native-${{ hashFiles('engine/lean-toolchain', 'engine/lake-manifest.json') }}-${{ hashFiles('engine/**/*.lean', 'engine/c/**') }}
          restore-keys: |
            engine-native-${{ hashFiles('engine/lean-toolchain', 'engine/lake-manifest.json') }}-
      - run: npm ci
      - name: engine/ depends on nothing beyond Init (no Mathlib)
        run: npm run check:engine
      - name: Build and test the engine
        working-directory: engine
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          lake build
          lake test
      - name: Every cell of the welcome notebook evaluates (it is the first thing a visitor runs)
        run: node scripts/notebooks/drive.mjs notebooks/welcome.chalk
      - name: The example notebooks give the answers they were written with (notebooks/golden; --update after a deliberate change)
        run: node scripts/notebooks/drive.mjs --check notebooks/*.chalk notebooks/courses/*/*.chalk
      - name: The example notebooks' Lean cells check, with the Lean the browser runs (engine/lean-toolchain)
        run: node scripts/notebooks/check-lean.mjs notebooks/*.chalk notebooks/courses/*/*.chalk
      - name: Build the TypeScript packages and type-check the notebook
        run: |
          npm run build
          npm run typecheck
      - name: Test the packages (the HTTP and stdio hosts over the native engine)
        run: npm test
      - name: Bundle the notebook
        run: npm run bundle
      - name: Math cells and the teaching features end to end in Chromium (the bundled notebook against the native engine)
        # the runner's Chrome: playwright-core ships no browser of its own
        run: CHROMIUM="${CHROME_BIN:-$(command -v google-chrome)}" node scripts/e2e-math.mjs e2e-math.png
      - name: Keep the end-to-end screenshot when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-math
          path: e2e-math.png
          if-no-files-found: ignore
