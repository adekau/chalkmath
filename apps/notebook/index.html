<html lang="en" data-theme="dark" data-outsize="m">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChalkMath — a math notebook that shows its work</title>
<meta name="description" content="A math notebook for learning, from algebra to linear algebra and calculus, that shows every step of its work. Runs in your browser; nothing you type leaves it." />

     developer-mode HTTP kernel. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />

:root {
  --raised: 0 1px 0 var(--hl-a) inset, 0 2px 6px var(--sh-c);
  --raised-strong: 0 1px 0 var(--pill-bg) inset, 0 2px 5px var(--sh-a);
  --pop: 0 8px 24px var(--scrim);
  --btn: linear-gradient(180deg, var(--btn-a), var(--btn-b));
  --btn-lift: linear-gradient(180deg, var(--btn-a), var(--btn-c));
  --primary: linear-gradient(180deg, var(--pri), var(--pri-2));
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --code: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --serif: 'Literata Variable', Georgia, 'Iowan Old Style', serif;
}

html, body { height: 100%; overflow: hidden; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 13px; }
a { color: var(--acc-hi); text-decoration: none; }
a:hover { color: var(--acc); text-decoration: underline; }
::selection { background: var(--sel-bg); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
*::-webkit-scrollbar { width: 11px; height: 11px; }
*::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-track { background: transparent; }
button { font-family: var(--font); }

#app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* --- title bar ------------------------------------------------------------ */
.titlebar { display:flex; align-items:center; gap:14px; height:38px; flex:0 0 38px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--border); }
.brand { display:flex; align-items:center; gap:8px; }
.brand .mark { display:block; width:22px; height:22px; user-select:none; }
.brand .name { font-weight:700; font-size:13px; margin:0; }
.menus { display:flex; align-items:center; gap:2px; }
.menus span { font-size:12px; color:var(--ink-mut); padding:5px 10px; border-radius:6px; cursor:default; }
.menus span:hover, .menus span.open { background:var(--hov); }
.menus .mwrap { position:relative; }
.menus .dropdown { position:absolute; top:100%; left:0; z-index:40; min-width:190px; padding:5px; margin-top:2px; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; box-shadow:var(--pop); }
.menus .dropdown .item { display:block; padding:6px 10px; border-radius:5px; font-size:12.5px; color:var(--ink); cursor:default; white-space:nowrap; }
.menus .dropdown .item:hover { background:var(--hov); }
.spacer { flex:1; }
.themebtn { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--btn-ink); background:var(--btn); border:1px solid var(--btn-edge); border-radius:999px; padding:4px 11px; cursor:pointer; box-shadow:0 1px 0 var(--hl-a) inset; }
.themebtn:hover { filter:brightness(1.15); }
.themebtn:active { transform:translateY(1px); }
.kernel { display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink-2); padding:4px 11px; border-radius:999px; background:var(--panel-2); border:1px solid var(--border); }
.kernel .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); }
.kernel .sep { color:var(--ink-mut); }
.kernel select { background:transparent; border:0; color:var(--ink-2); font:inherit; cursor:pointer; }
.kernel select option { background:var(--panel); color:var(--ink); }
#kurl { background:var(--bg); border:1px solid var(--border); color:var(--ink-2); font:11px var(--mono); border-radius:4px; padding:2px 6px; width:170px; }

/* --- tab bar -------------------------------------------------------------- */
.tabbar { display:flex; align-items:flex-end; gap:5px; height:38px; flex:0 0 38px; padding:0 10px; background:var(--bg); border-bottom:1px solid var(--border); }
.tab { display:flex; align-items:center; gap:9px; padding:6px 14px 7px; cursor:pointer; font-size:12px; border:1px solid var(--border); border-bottom:0; border-radius:7px 7px 0 0; color:var(--ink-mut); background:var(--panel); }
.tab .label { font-family:var(--mono); font-size:11.5px; }
.tab:hover { filter:brightness(1.14); }
.tab.on { color:var(--ink); font-weight:600; background:var(--panel-2); box-shadow:0 1px 0 var(--chip-bg) inset, 0 -3px 8px var(--sh-d); }
.tab .x { color:var(--ink-mut); font-size:13px; border-radius:3px; padding:0 3px; }
.tab .x:hover { color:var(--ink); background:var(--chip-bg); }
.tab.dirty .label { font-style:italic; }
.tabadd { padding:6px 10px; color:var(--ink-mut); font-size:15px; cursor:pointer; }
.tabadd:hover { color:var(--ink); }

/* --- body: rail | sidebar | main ------------------------------------------ */
.body { flex:1; display:flex; align-items:stretch; min-height:0; background:var(--bg); }
.rail { width:44px; flex:0 0 44px; display:flex; flex-direction:column; align-items:center; padding:8px 0; gap:6px; background:var(--bg); border-right:1px solid var(--border); }
.rail .b { width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; color:var(--ink-mut); background:var(--btn-lift); box-shadow:var(--raised); }
.rail .b.on { color:var(--on-acc); background:var(--primary); box-shadow:var(--raised-strong); }

.sidebar { width:236px; flex:0 0 236px; display:flex; flex-direction:column; min-height:0; background:var(--bg); border-right:1px solid var(--border); overflow:hidden; }
.sidebar h2 { display:flex; align-items:center; height:34px; flex:0 0 34px; margin:0; padding:0 14px; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-mut); background:var(--panel); border-bottom:1px solid var(--border); }
.sidebar .list { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:5px; }
.olrow { display:grid; grid-template-columns:40px minmax(0,1fr); gap:9px; align-items:center; padding:7px 10px; cursor:pointer; border-radius:8px; }
.olrow:hover { filter:brightness(1.15); background:var(--panel-2); }
.olrow.on { background:var(--panel-2); box-shadow:var(--raised); }
.olrow .num { font-family:var(--mono); font-size:10.5px; color:var(--ink-mut); }
.olrow.on .num { color:var(--acc-hi); }
.olrow .kind { display:block; font-size:11.5px; font-weight:600; color:var(--ink); }
.olrow .src { display:block; font-family:var(--mono); font-size:10.5px; color:var(--ink-mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.plrow { padding:7px 10px; cursor:pointer; border-radius:8px; }
.plhead { font-size:10px; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--ink-mut); padding:12px 10px 4px; }
.plrow:hover { background:var(--panel-2); }
.plrow .name { display:block; font-size:11.5px; font-weight:600; color:var(--acc-hi); }
.plrow .sig { display:block; font-family:var(--mono); font-size:10.5px; color:var(--ink-mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.main { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }

/* --- toolbar and button groups -------------------------------------------- */
.toolbar { display:flex; align-items:center; gap:8px; height:34px; flex:0 0 34px; padding:0 12px; border-bottom:1px solid var(--border); background:var(--panel); }
.bgroup { display:flex; align-items:stretch; height:22px; border:1px solid var(--btn-edge); border-radius:4px; overflow:hidden; box-shadow:0 1px 0 var(--hl-b) inset, 0 1px 3px var(--sh-b); }
.bgroup { flex:0 0 auto; }
.bgroup button { border:0; border-right:1px solid var(--btn-edge); font-size:11px; padding:0 9px; cursor:pointer; display:flex; align-items:center; gap:5px; background:var(--btn); color:var(--ink-2); font-weight:500; white-space:nowrap; }
.bgroup button:last-child { border-right:0; }
.bgroup button:hover { filter:brightness(1.16); }
.bgroup button:active { transform:translateY(1px); filter:brightness(0.9); }
.bgroup button.primary { background:var(--primary); border-right-color:var(--pri-edge); color:var(--pri-ink); font-weight:600; }
.bgroup button.on { background:var(--primary); color:var(--on-acc); }
.vsep { width:1px; height:18px; background:var(--border); }
.bgroup button:disabled { opacity:0.45; cursor:default; filter:none; transform:none; }
.toolbar .tlabel { font-size:10px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-mut); margin-left:6px; }
/* the strip above the paper: engine loading or failed, or a notebook not run yet */
.notice { display:flex; align-items:center; gap:10px; flex:0 0 auto; padding:7px 14px; font-size:12px; color:var(--ink-2); background:var(--acc-soft-bg2); border-bottom:1px solid var(--acc-soft-br); }
.notice .msg { flex:1; min-width:0; }
.notice.bad { color:var(--danger-hi); background:var(--danger-soft); border-bottom-color:var(--danger-2); }
.notice.wait { color:var(--ink-mut); background:var(--panel); border-bottom-color:var(--border); animation:notice-in .2s .5s both; }   /* shown only if loading takes a moment */
@keyframes notice-in { from { opacity:0; } }
.notice.flash { animation:notice-flash .6s ease-out; }
@keyframes notice-flash { 30% { filter:brightness(1.6); } }
.notice button { font:11.5px var(--font); font-weight:600; padding:3px 11px; border-radius:4px; border:1px solid var(--btn-edge); background:var(--btn); color:var(--ink-2); cursor:pointer; white-space:nowrap; }
.notice button:first-of-type { background:var(--primary); color:var(--pri-ink); border-color:var(--pri-edge); }
.notice button:hover { filter:brightness(1.12); }
.toolbar .count { font-family:var(--mono); font-size:10px; color:var(--ink-mut); }
.toolbar .hint { font-size:10.5px; color:var(--ink-mut); }

/* --- the paper: cells ----------------------------------------------------- */
.cells { flex:1; overflow-y:auto; min-height:0; padding:22px 0 70px; color:var(--p-ink); font-family:var(--serif);
  background-color:var(--paper-bg); background-image:var(--paper-mottle), var(--paper-grain); background-attachment:local, local; background-size:300px 300px, 160px 160px;
  box-shadow:inset 0 1px 0 var(--p-hl2), inset 0 -16px 30px -30px var(--p-sh2); }
.cells::-webkit-scrollbar-thumb { background:var(--p-scroll); background-clip:content-box; }
.cells ::selection { background:var(--p-sel); }
.cell { position:relative; display:grid; grid-template-columns:82px minmax(0,1fr) 30px; align-items:start; padding:8px 12px 10px 0; }
.cell:hover { background:var(--p-cell-hover); }
.gap { position:relative; height:12px; margin:-6px 0; cursor:pointer; z-index:2; }
.gap::before { content:""; position:absolute; left:82px; right:30px; top:50%; border-top:1px solid var(--p-acc); opacity:0; transition:opacity .12s; }
.gap .gappill { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; font-family:var(--code); font-size:10px; line-height:14px; border-radius:9px; background:var(--p-acc); color:var(--on-acc); opacity:0; transition:opacity .12s; user-select:none; white-space:nowrap; overflow:hidden; }
.gap .gapmain { padding:1px 7px 1px 9px; }
.gap .gapmore { padding:1px 7px 1px 5px; border-left:1px solid rgba(0,0,0,0.25); }
.gap .gapmain:hover, .gap .gapmore:hover { background:rgba(255,255,255,0.18); }
.gap:hover::before, .gap:hover .gappill { opacity:1; }
.typemenu .item { flex-direction:column; align-items:flex-start; gap:1px; }
.typemenu .item .hint { font-size:10.5px; color:var(--ink-mut); font-weight:400; }
.typemenu .item.on { color:var(--acc-hi); }
/* section headings: a title over a rule, folding the cells below */
.cell.section { margin-top:14px; }
.cell.section .prompt { color:var(--p-mut3); }
.sectrow { display:flex; align-items:center; gap:4px; padding-right:150px; border-bottom:1px solid var(--p-br-idle); }
.secttog { flex:0 0 18px; text-align:center; font-size:11px; color:var(--p-mut); cursor:pointer; user-select:none; }
.secttog:hover { color:var(--p-acc); }
.sectin { flex:1; min-width:0; background:transparent; border:0; border-radius:6px; padding:3px 8px; font-family:var(--serif); font-size:21px; font-weight:600; letter-spacing:-0.005em; color:var(--p-ink-strong); }
.sectin::placeholder { color:var(--p-ph); font-weight:500; }
.cell.active .sectin { background:var(--p-input-bg); box-shadow:inset 0 0 0 1px var(--p-input-br); }
.sectcount { flex:0 0 auto; font-family:var(--code); font-size:10.5px; color:var(--p-mut); padding-right:6px; }
/* markdown cells: an editor that grows with its text, and the rendering in the paper's serif */
.mdin { display:block; width:100%; box-sizing:border-box; background:var(--p-input-bg); border:0; box-shadow:inset 0 0 0 1px var(--p-input-br); border-radius:6px; color:var(--p-ink); font-family:var(--code); font-size:13.5px; line-height:1.55; padding:6px 150px 6px 8px; resize:none; overflow:hidden; min-height:34px; }
.mdin::placeholder { color:var(--p-ph); }
.mdout { padding:4px 150px 4px 8px; border-radius:6px; outline:none; font-family:var(--serif); font-size:16.5px; line-height:1.62; color:var(--p-ink); max-width:76ch; overflow-wrap:anywhere; }
.mdout:focus { box-shadow:inset 0 0 0 1px var(--p-input-br); }
.mdout > :first-child { margin-top:0; }
.mdout > :last-child { margin-bottom:0; }
.mdout p, .mdout ul, .mdout ol, .mdout blockquote, .mdout pre, .mdout figure { margin:0 0 0.75em; }
.mdout h1, .mdout h2, .mdout h3, .mdout h4, .mdout h5, .mdout h6 { margin:0.9em 0 0.4em; line-height:1.25; font-weight:600; color:var(--p-ink-strong); letter-spacing:-0.01em; }
.mdout h1 { font-size:1.75em; } .mdout h2 { font-size:1.4em; } .mdout h3 { font-size:1.18em; } .mdout h4, .mdout h5, .mdout h6 { font-size:1em; }
.mdout a { color:var(--p-acc); text-decoration:none; border-bottom:1px solid var(--p-br-hov); }
.mdout a:hover { border-bottom-color:var(--p-acc); }
.mdout code.mdcode { font-family:var(--code); font-size:0.86em; background:var(--p-input-bg); box-shadow:inset 0 0 0 1px var(--p-input-br); border-radius:4px; padding:1px 4px; }
.mdout pre.mdpre { font-family:var(--code); font-size:12.5px; line-height:1.5; background:var(--p-input-bg); box-shadow:inset 0 0 0 1px var(--p-input-br); border-radius:6px; padding:9px 11px; overflow-x:auto; white-space:pre; }
.mdout blockquote { padding:0 0 0 12px; border-left:3px solid var(--p-br-idle); color:var(--p-ink-3); }
.mdout ul, .mdout ol { padding-left:1.6em; }
.mdout li { margin:0.15em 0; }
.mdout hr { border:0; border-top:1px solid var(--p-br-idle); margin:1em 0; }
.mdout img { max-width:100%; height:auto; border-radius:4px; }
.mdout figure { text-align:center; }
.mdout figcaption { font-size:0.82em; color:var(--p-mut); margin-top:0.35em; }
.mdout .mdmath { overflow-x:auto; overflow-y:hidden; margin:0.5em 0 0.8em; font-size:1.05em; }
.mdout .mdmath .katex-display { margin:0.2em 0; }
.mdout .mdempty { color:var(--p-ph); font-style:italic; font-size:0.9em; }
.olrow.in { margin-left:12px; }
.olrow.section .kind { color:var(--acc-hi); }
.olrow.section .num, .olrow.markdown .num { font-size:12px; }
.cell.active { background:var(--p-cell-active); }
.cell .prompt { text-align:right; padding:5px 12px 0 0; line-height:23px; font-family:var(--code); font-size:11px; letter-spacing:0.01em; color:var(--p-mut3); user-select:none; }
.cell.done .prompt { color:var(--p-acc); }
.cell.running > .prompt { color:var(--p-acc); animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity:0.35; } }
.cell .mid { position:relative; min-width:0; }
.cellin { width:100%; box-sizing:border-box; background:transparent; border:0; border-radius:6px; color:var(--p-ink); font-family:var(--code); font-size:14px; line-height:1.65; padding:5px 8px; }
/* room for the action buttons only while they are shown, so a long input is not hidden under invisible buttons */
.cell:hover .cellin, .cell.active .cellin { padding-right:150px; }
.cell.active .cellin { background:var(--p-input-bg); box-shadow:inset 0 0 0 1px var(--p-input-br); }
.cellin::placeholder { color:var(--p-ph); }
/* the visual input (packages/math-editor): typeset math with a caret, in the same box as the text input */
.cell .mi { display:block; width:100%; box-sizing:border-box; min-height:36px; padding:5px 8px; border-radius:6px; color:var(--p-ink);
  font-size:var(--sz-echo);   /* View › Math size, as the input interpretation and a little under the outputs */
  --mi-caret:var(--p-ink-strong); --mi-hole:var(--p-ink-3); --mi-cmd:var(--p-acc); --mi-focus:var(--p-input-br);
  --mi-sel:var(--p-sel); --mi-err:var(--p-err-line); --mi-err-bg:var(--p-err-bg); --mi-chip:var(--p-acc-chip); --mi-chip-edge:var(--p-acc-br);
  --mi-word-font:var(--code); --mi-word-size:14px; }   /* keywords and names as the text input sets them */
.cell:hover .mi, .cell.active .mi { padding-right:150px; }
.cell.active .mi, .cell .mi.focused { background:var(--p-input-bg); box-shadow:inset 0 0 0 1px var(--p-input-br); }
.cell .mi .mi-math { overflow-x:auto; overflow-y:hidden; }
/* the math keypad: templates and moves above a phone's keyboard while a math cell has the focus */
.keypad { position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex; gap:6px; overflow-x:auto; padding:7px 10px;
  background:var(--panel); border-top:1px solid var(--border); box-shadow:0 -2px 8px var(--sh-b); }
.keypad button { flex:0 0 auto; min-width:42px; height:38px; padding:0 10px; border:1px solid var(--btn-edge); border-radius:6px;
  background:var(--btn); color:var(--ink-2); font-family:var(--serif); font-size:16px; cursor:pointer; }
.keypad button { -webkit-tap-highlight-color:transparent; }
.keypad button:focus:not(:focus-visible) { outline:none; }
@media (hover: none) { .keypad button:hover { background:var(--btn); } }
.keypad button:active { transform:translateY(1px); filter:brightness(0.9); }
.keypad.text .kvisual { display:none; }
/* the text highlighter's colours on the visual input's tokens */
html:not(.nohl) .mi-math [data-hl="hnum"] { color:var(--hl-num); }
html:not(.nohl) .mi-math [data-hl="hkw"] { color:var(--hl-kw); font-weight:600; }
html:not(.nohl) .mi-math [data-hl="hcmd"] { color:var(--hl-cmd); font-weight:600; }
html:not(.nohl) .mi-math [data-hl="hfn"] { color:var(--hl-fn); }
html:not(.nohl) .mi-math [data-hl="hbound"] { color:var(--hl-bound); }
html:not(.nohl) .mi-math [data-hl="hdef"] { color:var(--hl-def); }
html:not(.nohl) .mi-math [data-hl="hconst"] { color:var(--hl-const); }
/* syntax highlighting: the input's text is transparent over an overlay with the same metrics; the caret stays the input's */
html:not(.nohl) .cellin { color:transparent; caret-color:var(--p-ink); }
html:not(.nohl) .cellin::selection { color:transparent; }
.hl { position:absolute; inset:0; padding:5px 8px; font-family:var(--code); font-size:14px; line-height:1.65; color:var(--p-ink); white-space:pre; overflow:hidden; pointer-events:none; box-sizing:border-box; }
.cell:hover .hl, .cell.active .hl { padding-right:150px; }
.hl .hlin { display:inline-block; will-change:transform; }
.hl .hnum { color:var(--hl-num); }
.hl .hkw { color:var(--hl-kw); font-weight:600; }
.hl .hcmd { color:var(--hl-cmd); font-weight:600; }
.hl .hfn { color:var(--hl-fn); }
.hl .hbound { color:var(--hl-bound); font-style:italic; }
.hl .hdef { color:var(--hl-def); }
.hl .hconst { color:var(--hl-const); }
.hl .hop { color:var(--p-mut); }
.hl .hpun { color:var(--p-mut2); }
.hl .hvar { color:var(--p-ink); }
.hl .hasset { color:var(--p-acc); background:var(--p-acc-chip); border-radius:4px; box-shadow:0 0 0 1px var(--p-acc-br); }
/* an attached file in a visual input: the same chip as in the text */
.mi [data-asset] .boxpad { color:var(--p-acc); }
.mi [data-asset] .fbox { border-color:var(--p-acc-br) !important; border-radius:4px; background:var(--p-acc-chip); }
.hl .hasset.missing { color:var(--p-err); background:var(--p-err-bg); box-shadow:0 0 0 1px var(--p-err-line); }
.hl .hstr { color:var(--hl-const); }
.imgbox { padding:10px; }
.outimg { display:block; max-width:100%; max-height:320px; margin:0 auto; background:#fdfaf2; border-radius:6px; padding:6px; box-sizing:border-box; }
/* the data table: a CSV file, or a matrix too large to typeset; header and row numbers stay in view */
.dgrid { width:fit-content; max-width:100%; box-sizing:border-box; max-height:360px; overflow:auto; border:1px solid var(--p-br-out); border-radius:6px; background:var(--paper-bg); font-size:13px; color:var(--p-ink); margin:4px 0; }
.dgrid:focus-visible { outline:2px solid var(--p-br-act); outline-offset:1px; }
.dgrid table { border-collapse:separate; border-spacing:0; }
.dgrid th, .dgrid td { padding:3px 10px; border-bottom:1px solid var(--p-row-bg); white-space:nowrap; text-align:left; max-width:24em; overflow:hidden; text-overflow:ellipsis; }
.dgrid td { font-family:var(--code); font-size:12.5px; }
.dgrid td .katex { font-size:1.05em; }
.dgrid thead th { position:sticky; top:0; z-index:2; background:var(--p-btn-b); color:var(--p-ink-strong); font-family:var(--font); font-weight:600; border-bottom:1px solid var(--p-br-out); }
.dgrid th.dg-no { position:sticky; left:0; z-index:1; background:var(--p-btn-b); color:var(--p-mut); font-family:var(--code); font-weight:400; font-size:11px; text-align:right; min-width:2.5em; border-right:1px solid var(--p-br-out); }
.dgrid thead th.dg-no { z-index:3; }
.dgrid .dg-num { text-align:right; font-variant-numeric:tabular-nums; }
.dgrid tbody tr:nth-child(even) td { background:var(--p-row-bg); }
.dgrid tbody tr:hover td { background:var(--p-hov); }
.dg-more { position:sticky; left:0; padding:6px 10px; font-size:11px; color:var(--p-mut); font-family:var(--font); }
.mdout .dgrid { margin:8px 0; }
/* a file with no display of its own, and text files */
.filecard { display:inline-flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid var(--p-br-out); border-radius:8px; background:var(--p-input-bg); color:var(--p-ink); font-family:var(--font); font-size:14px; }
.filecard .fileicon { font-size:20px; color:var(--p-mut); }
.filecard .filename { font-weight:600; }
.filecard .filemeta { color:var(--p-mut); font-size:12.5px; }
.filetext { max-height:320px; overflow:auto; margin:4px 0; padding:10px 12px; border:1px solid var(--p-br-out); border-radius:6px; background:var(--p-input-bg); color:var(--p-ink); font-family:var(--code); font-size:12.5px; line-height:1.5; white-space:pre; }
.filecap code { font-family:var(--code); font-size:11px; color:var(--p-ink-2); }
/* Mathematica's suggestions bar under a file: short chips (their code in the tooltip), and × to hide it */
.trybar { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:7px; }
.trychip { font-family:var(--font); font-size:11.5px; line-height:1; padding:5px 9px; border-radius:999px; cursor:pointer; color:var(--p-ink-2); background:var(--p-input-bg); box-shadow:inset 0 0 0 1px var(--p-br-out); white-space:nowrap; }
.trychip:hover, .trychip:focus-visible { color:var(--p-acc-ink); background:var(--p-acc-bg); box-shadow:inset 0 0 0 1px var(--p-acc-br); outline:none; }
.tryx { font-size:14px; line-height:1; padding:3px 6px; border-radius:4px; cursor:pointer; color:var(--p-mut); }
.tryx:hover, .tryx:focus-visible { color:var(--p-ink); background:var(--p-hov); outline:none; }
html[data-outsize="s"] { --sz-out:17px; --sz-echo:14px; --sz-work:13px; --sz-sub:12px; }
html[data-outsize="m"] { --sz-out:22px; --sz-echo:18px; --sz-work:16px; --sz-sub:14px; }
html[data-outsize="l"] { --sz-out:28px; --sz-echo:22px; --sz-work:19px; --sz-sub:17px; }
.echo { font-size:var(--sz-echo, 18px); line-height:1.7; color:var(--p-ink-3); padding:9px 8px 0; }
.cellmeta { display:flex; align-items:center; gap:8px; min-height:20px; margin-top:8px; padding-left:8px; }
.kindbadge { display:inline-flex; align-items:center; gap:5px; font-size:9.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; font-family:var(--font); color:var(--p-acc-ink); background:var(--p-acc-bg); border:1px solid var(--p-acc-br); border-radius:3px; padding:2px 7px; cursor:help; }
.kindbadge:hover { filter:brightness(1.18); }
.kindbadge .i { display:inline-flex; align-items:center; justify-content:center; width:12px; height:12px; border-radius:50%; background:var(--p-acc-chip); font-size:8px; font-style:italic; }
.timing { font-family:var(--code); font-size:10px; color:var(--p-mut2); }
/* Lean cells: the VS Code editor (lean4monaco) as the input, Lean's messages as the output */
.cell.lean .leanview { min-height:24px; border:1px solid var(--p-input-br); border-radius:6px; overflow:hidden; background:var(--p-input-bg); }
.cell.lean .leanview.pending { font-family:var(--code); font-size:13px; line-height:19px; white-space:pre-wrap; padding:5px 8px; color:var(--p-mut); }
.leanstate { margin:8px 0 0 8px; font-size:12.5px; color:var(--p-mut); }
.leanstate.failed { color:var(--p-err); }
.leanbar { position:relative; height:4px; max-width:360px; margin:6px 0 0 8px; border-radius:2px; overflow:hidden; background:var(--p-input-br); }
.leanbar > div { height:100%; background:var(--p-acc); transition:width .2s linear; }
.leanbar.busy > div { width:30%; animation:leanbusy 1.3s ease-in-out infinite; }
@keyframes leanbusy { from { transform:translateX(-100%); } to { transform:translateX(340%); } }
.leanmsg { display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; margin:6px 0 0 8px; font-size:12.5px; line-height:1.55; }
.leanmsg .where { font-family:var(--code); color:var(--p-mut3); }
.leanmsg .text { font-family:var(--code); white-space:pre-wrap; overflow-wrap:anywhere; color:var(--p-ink); }
.leanmsg.error .text { color:var(--p-err); }
.leanmsg.warning .text { color:var(--p-acc-ink); }
.panel .leaninfo { flex:1; min-height:0; }
.panel .leaninfo.off { flex:0 0 0; height:0; visibility:hidden; overflow:hidden; }
.panel .leaninfo iframe { width:100%; height:100%; border:0; }
.cellerr { margin:10px 0 0 8px; font-size:12.5px; line-height:1.65; color:var(--p-err); background:var(--p-err-bg); border-left:2px solid var(--p-err-line); border-radius:0 6px 6px 0; padding:8px 12px; }
.cellerr .caret { font-family:var(--code); color:var(--p-mut); display:block; margin-top:4px; white-space:pre; }
/* `?` lookups: progress, then where the answer came from (apps/notebook/src/ask-cells.ts) */
.askprog { margin:10px 0 0 8px; font-size:12.5px; line-height:1.7; color:var(--p-mut); }
.askprog .done { opacity:0.7; }
.askprog .now { color:var(--p-ink-2); font-style:italic; }
.askprog .secs { font-style:normal; font-family:var(--code); font-size:11px; color:var(--p-mut); margin-left:4px; }
.askprog .detail { font-style:normal; color:var(--p-acc); }
.askinfo { padding-left:8px; margin-top:6px; font-size:12px; line-height:1.6; color:var(--p-ink-2); font-family:var(--font); }
.askhead { color:var(--p-mut); }
.askhead a { color:var(--p-acc); }
.askbadge { font-size:9.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; border-radius:999px; padding:1px 8px; color:var(--on-acc); }
.askbadge.ok { background:var(--ok); }
.askbadge.kn { background:var(--p-mut); }
.askbadge.warn { background:var(--warn); }
.askline { margin-top:2px; }
.askkey { color:var(--p-mut); margin-right:6px; }
.askkey::after { content:":"; }
.askmut { color:var(--p-mut); }
.askinfo code { font-family:var(--code); font-size:11.5px; }
.asknote { margin-top:4px; color:var(--p-mut); }
.asknote.warn { color:var(--warn); }
.asktrail { margin-top:4px; color:var(--p-mut); }
.asktrail summary { cursor:pointer; font-size:11.5px; }
.asktrail ol { margin:4px 0 0; padding-left:20px; }
.cellerr + .asktrail { margin-left:8px; font-size:12px; }
.hl .hq { color:var(--p-acc); font-weight:700; }
.hl .hask { color:var(--p-ink); font-style:italic; }

.outheld { display:inline-block; min-width:2.2em; padding:0 12px; border:1px dashed var(--p-acc-br); border-radius:7px; color:var(--p-acc); text-align:center; cursor:pointer; font-family:var(--font); }

.step { display:grid; grid-template-columns:24px minmax(0,250px) minmax(0,1fr); gap:12px; align-items:center; padding:7px 11px; border-radius:7px; cursor:pointer; background:var(--p-row-bg); }

svg .axis { stroke:var(--ink-mut); stroke-width:1; }

.plotcap .legend.c1 .swatch { background:var(--curve1); } .plotcap .legend.c2 .swatch { background:var(--curve2); } .plotcap .legend.c3 .swatch { background:var(--curve3); } .plotcap .legend.c4 .swatch { background:var(--curve4); } .plotcap .legend.c5 .swatch { background:var(--curve5); }

.step.sub { padding-top:5px; padding-bottom:5px; grid-template-columns:34px minmax(0,224px) minmax(0,1fr); }

.step.more { display:block; font-size:12px; color:var(--p-mut); font-family:var(--font); }
.work.pending { font-size:12px; color:var(--p-mut); font-family:var(--font); }
.step .rulecol { display:flex; flex-direction:column; gap:2px; min-width:0; }
.step .why { font-size:11px; line-height:1.4; color:var(--p-mut2); font-family:var(--font); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

.step.on .why { color:var(--p-ink-3); }
.step.on { background:var(--p-acc-bg2); }
.step .no { display:inline-flex; align-items:center; justify-content:center; width:19px; height:19px; border-radius:50%; font-family:var(--code); font-size:9.5px; color:var(--p-mut); background:var(--p-no-bg); }

.step.on .rule { color:var(--p-acc-ink); }

.vmark { width:6px; height:6px; border-radius:50%; flex:0 0 6px; }

.vmark.checked { background:transparent; border:1.5px solid var(--ok); box-sizing:border-box; }
.vmark.unverified { background:var(--ink-faint); }
.cellacts { position:absolute; top:6px; right:44px; display:flex; align-items:center; gap:5px; opacity:0; pointer-events:none; transition:opacity 110ms linear; }

.cellacts span { display:inline-flex; align-items:center; gap:4px; height:20px; font-size:9.5px; font-weight:600; font-family:var(--font); color:var(--p-btn-ink); background:linear-gradient(180deg, var(--p-btn-a), var(--p-btn-b)); border:1px solid var(--p-btn-br); border-radius:3px; padding:0 7px; cursor:pointer; box-shadow:0 1px 0 var(--p-hl) inset, 0 1px 2px var(--p-sh); }

.modal { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.35); }
.modalcard { width:min(560px, 92vw); max-height:80vh; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:var(--pop); padding:16px 18px; font-family:var(--font); color:var(--ink); }

.liblist { overflow-y:auto; display:flex; flex-direction:column; gap:4px; }

.modalfoot { display:flex; align-items:center; gap:8px; margin-top:14px; }

.cellmenu { position:fixed; z-index:60; min-width:200px; padding:5px; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; box-shadow:var(--pop); font-family:var(--font); }

.cellmenu .item.hassub:hover > .submenu { display:block; }

.cellacts span:active { transform:translateY(1px); filter:brightness(0.92); }
.brk { justify-self:end; align-self:stretch; width:9px; min-height:26px; border-top:1.5px solid var(--p-br-idle); border-right:1.5px solid var(--p-br-idle); border-bottom:1.5px solid var(--p-br-idle); border-radius:0 2px 2px 0; }
.cell:hover .brk { border-color:var(--p-br-hov); }
.cell.active .brk { border-color:var(--p-acc-2); }
.outrow { grid-column:1 / -1; display:grid; grid-template-columns:82px minmax(0,1fr) 30px; align-items:start; margin-top:10px; }
.outrow .prompt { color:var(--p-acc); padding-top:4px; display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
.formsel { font:9.5px var(--font); color:var(--p-mut); background:transparent; border:1px solid var(--p-br-idle); border-radius:3px; padding:1px 2px; max-width:66px; opacity:0; transition:opacity 110ms linear; cursor:pointer; }
.cell:hover .formsel, .cell.active .formsel { opacity:1; }
.outtext { font-family:var(--code); font-size:14px; color:var(--p-ink); white-space:pre-wrap; }
.outrow .brk { border-color:var(--p-br-out); }
.cell.active .outrow .brk { border-color:var(--p-acc-2); }
.outval { font-size:var(--sz-out, 22px); line-height:1.6; color:var(--p-ink-strong); padding-left:8px; min-width:0; overflow-x:auto; overflow-y:hidden; }   /* overflow-y: KaTeX's vlist struts overflow a scroll container by a few px below the strut; hidden, like .step .el */
.katex [data-path] { cursor:pointer; border-radius:3px; padding:0 1px; }
/* a matrix (or any tall subterm) is taller than its line box; let the highlight follow the content */
.katex [data-path]:has(.mtable) { display:inline-block; }
/* the innermost hovered subterm only: an ancestor is hovered too, but must not light up with it */
.katex [data-path]:hover:not(:has([data-path]:hover)) { background:var(--p-hov); box-shadow:0 0 0 1px var(--p-acc-br); }
/* KaTeX draws the radical sign (and the fraction and overline rules) as overlays on top of the content;
   they must not swallow the pointer, or a subterm under a √ can never be hovered or clicked */
.katex .sqrt .hide-tail, .katex .sqrt svg, .katex .frac-line, .katex .overline-line { pointer-events:none; }
/* what a step changed; hovering it shows old → new */
.katex [data-path].chg { background:var(--p-chg-bg); box-shadow:0 0 0 1px var(--p-chg-br); }
.difftip { position:fixed; z-index:60; display:flex; align-items:center; gap:10px; padding:6px 12px; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; box-shadow:var(--pop); color:var(--ink); font-size:15px; pointer-events:none; white-space:nowrap; }

.katex [data-path].sel { background:var(--p-sel); box-shadow:0 0 0 1px var(--p-acc-2); }

/* --- documentation (Help › Documentation): contents beside a page on the paper -------- */
.docs { flex:1; min-height:0; display:flex; }
.docnav { flex:0 0 230px; width:230px; display:flex; flex-direction:column; min-height:0; background:var(--panel); border-right:1px solid var(--border); }

.doclist { flex:1; overflow-y:auto; padding:0 8px 16px; }
.docgroup { font-size:10px; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--ink-mut); padding:12px 8px 5px; }

.docnone { font-size:12px; color:var(--ink-mut); padding:10px 8px; }
.docmain { flex:1; min-width:0; overflow-y:auto; color:var(--p-ink);
  background-color:var(--paper-bg); background-image:var(--paper-mottle), var(--paper-grain); background-attachment:local, local; background-size:300px 300px, 160px 160px; }

.docpage table.keys kbd { color:var(--p-ink); background:var(--p-input-bg); border-color:var(--p-input-br); }
.docfoot { display:flex; gap:12px; margin-top:40px; }

/* a function's page: Mathematica's layout */
.fnhead { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; border-bottom:2px solid var(--p-acc-2); padding-bottom:8px; }

.exsec { margin-top:18px; }

.exhead .link { font-size:11.5px; }
.exsec > .mdout { font-size:15px; margin:10px 0 6px; }
.expair { padding:6px 0 8px; border-bottom:1px dashed var(--p-br-out); }
.exrow { display:grid; grid-template-columns:72px minmax(0,1fr); align-items:baseline; gap:6px; }
.exrow + .exrow { margin-top:6px; }
.exprompt { font-family:var(--code); font-size:10.5px; color:var(--p-mut); text-align:right; white-space:nowrap; }
.exout .exprompt { color:var(--p-acc); }
.exout:has(.plotbox) { align-items:start; }
.exout:has(.plotbox) .exprompt { padding-top:8px; }
.exin { font-family:var(--code); font-size:13.5px; color:var(--p-ink); white-space:pre-wrap; overflow-wrap:anywhere; }
.exval { font-size:19px; color:var(--p-ink-strong); min-width:0; overflow-x:auto; overflow-y:hidden; }
.exval.pending { font-size:13px; color:var(--p-mut); }
.exval.err { font-size:13px; color:var(--p-err); }
.exval .plotbox { margin:2px 0; }
.exsummary { display:block; font-size:12.5px; color:var(--p-mut); margin-top:2px; }
.exnote { font-size:13px; color:var(--p-mut); margin:8px 0 0; }
.fnsee { display:flex; flex-wrap:wrap; gap:6px 16px; font-family:var(--code); font-size:13.5px; }
.fnsee a, .fnindex a { color:var(--p-acc); }
.fnref { display:inline-block; margin-top:16px; font-size:12px; color:var(--p-acc); }
/* the index of functions */
.fnindex h2 { font-family:var(--serif); font-size:20px; font-weight:600; color:var(--p-ink-strong); margin:26px 0 2px; }
.fnareawhat { font-size:13.5px; color:var(--p-mut); margin:0 0 10px; }
.fngrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:8px 22px; }
.fnitem { display:flex; flex-direction:column; gap:1px; }
.fnitem a { font-family:var(--code); font-size:13.5px; font-weight:600; }
.fnitem .fnwhat { font-size:12.5px; line-height:1.45; color:var(--p-ink-3); }
.exlist { display:flex; flex-direction:column; gap:10px; }
.excard { padding:14px 16px; border-radius:10px; background:var(--p-input-bg); border:1px solid var(--p-br-out); cursor:pointer; }
.excard:hover { border-color:var(--p-acc-br); }
.excard .t { font-size:14px; font-weight:600; color:var(--p-ink-strong); }
.excard .b { font-size:13px; line-height:1.5; color:var(--p-ink-2); margin-top:4px; }
.link { color:var(--acc-hi); cursor:pointer; }
.link:hover { text-decoration:underline; }
.sellinks { margin-top:10px; font-size:11.5px; }

/* --- Manim Studio --------------------------------------------------------- */
.studio { flex:1; min-height:0; display:flex; flex-direction:column; }
.studio-top { flex:1; min-height:0; display:flex; align-items:stretch; }
.stagecol { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; border-right:1px solid var(--border); }
.scenebar { display:flex; align-items:center; gap:8px; height:34px; flex:0 0 34px; padding:0 12px; border-bottom:1px solid var(--border); background:var(--panel); }
.scenetab { display:inline-flex; align-items:center; gap:6px; height:21px; white-space:nowrap; flex:0 0 auto; padding:0 4px 0 9px; border-radius:3px; cursor:pointer; font-size:10.5px; font-weight:600; color:var(--ink-mut); background:var(--panel-2); border:1px solid var(--border); }
.scenetab:hover { filter:brightness(1.18); }
.scenetab.on { color:var(--on-acc); background:var(--primary); border-color:var(--pri-edge); }
.scenetab .x { color:var(--ink-faint); font-size:12px; padding:0 3px; }
.scenetab.on .x { color:var(--p-hl); }
.scenetab .x:hover { color:var(--danger-hi); }
.smallbtn { display:inline-flex; align-items:center; height:21px; white-space:nowrap; flex:0 0 auto; padding:0 9px; border-radius:3px; cursor:pointer; font-size:10.5px; font-weight:600; color:var(--ink-2); background:var(--btn); border:1px solid var(--btn-edge); box-shadow:0 1px 0 var(--hl-a) inset; }
.smallbtn:hover { filter:brightness(1.18); }
.smallbtn:active { transform:translateY(1px); filter:brightness(0.9); }
.scenebar .info { font-size:10.5px; color:var(--ink-mut); white-space:nowrap; }
.stage { flex:1; min-height:170px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:18px; background:var(--stage-bg); position:relative; overflow:hidden; }
.stage .grid { position:absolute; inset:0; background-image:linear-gradient(var(--panel) 1px, transparent 1px), linear-gradient(90deg, var(--panel) 1px, transparent 1px); background-size:40px 40px; opacity:0.5; }
.stage .label { position:absolute; top:10px; left:14px; font-family:var(--mono); font-size:9.5px; color:var(--ink-mut); }
.stage .center { position:relative; text-align:center; max-width:100%; display:flex; flex-direction:column; align-items:center; }
.stage .morph { position:relative; transform-origin:center center; color:var(--ink); }
.stage .empty { position:relative; text-align:center; max-width:44ch; }
.stage .empty .t { font-size:13px; color:var(--ink-2); margin-bottom:6px; }
.stage .empty .s { font-size:11.5px; line-height:1.6; color:var(--ink-mut); }
.stage .empty code { font-family:var(--mono); color:var(--acc-hi); }
.stage .foot { position:absolute; bottom:14px; left:0; right:0; display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap; padding:0 16px; }
.stage .caption { font-size:12.5px; font-weight:600; color:var(--acc-hi); }
.mark { font-size:10.5px; font-weight:600; border-radius:3px; padding:1px 7px; }
.mark.gone { color:var(--danger); background:var(--danger-soft); }
.mark.added { color:var(--ok); background:var(--ok-soft); }
.transport { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; flex:0 0 auto; padding:8px 12px; border-top:1px solid var(--border); background:var(--panel); }
.transport input[type=range] { flex:1 1 140px; min-width:140px; accent-color:var(--pri); height:4px; cursor:pointer; }
.transport .time { font-family:var(--mono); font-size:10px; color:var(--ink-mut); white-space:nowrap; }
.shots { flex:0 0 300px; width:300px; display:flex; flex-direction:column; min-height:0; background:var(--bg); }
.shotshead { display:flex; align-items:center; height:34px; flex:0 0 34px; padding:0 12px; font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-mut); background:var(--panel); border-bottom:1px solid var(--border); }
.shotshead .n { font-family:var(--mono); font-size:9.5px; font-weight:400; letter-spacing:0; text-transform:none; }
.shotlist { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:4px; }
.shot { border-radius:7px; background:var(--panel); border:1px solid var(--border); padding:7px 8px; }
.shot.on { background:var(--acc-soft-bg2); border-color:var(--acc); }
.shot .r1 { display:flex; align-items:center; gap:7px; }
.shot .no { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; cursor:pointer; font-family:var(--mono); font-size:9px; color:var(--ink-mut); background:var(--hov); flex:0 0 18px; }
.shot.on .no { color:var(--on-acc); background:var(--acc); }
.shot .lbl { flex:1; min-width:0; background:transparent; border:0; color:var(--ink-2); font-family:Inter, var(--font); font-size:11.5px; font-weight:600; padding:2px 3px; border-radius:3px; }
.shot.on .lbl { color:var(--acc-on); }
.shot.off .lbl { color:var(--ink-faint); }
.shot .tog { font-size:10px; cursor:pointer; color:var(--ink-faint); }
.shot .tog.on { color:var(--ok); }
.shot .mv { font-size:9px; color:var(--ink-faint); cursor:pointer; }
.shot .mv:hover { color:var(--ink-2); }
.shot .del { font-size:12px; color:var(--ink-faint); cursor:pointer; }
.shot .del:hover { color:var(--danger-hi); }
.shot .r2 { display:flex; align-items:center; gap:6px; margin-top:6px; }
.shot select, .shot input[type=number] { height:20px; background:var(--panel-2); color:var(--ink-2); border:1px solid var(--border); border-radius:3px; font-size:10px; font-family:var(--mono); padding:0 4px; }
.shot select { flex:1; min-width:0; }
.shot input[type=number] { width:46px; }
.shot .s { font-size:9.5px; color:var(--ink-mut); }
.code { flex:0 0 auto; display:flex; flex-direction:column; min-height:0; border-top:1px solid var(--border); background:var(--bg); overflow:hidden; }
.codehead { display:flex; align-items:center; gap:8px; height:32px; flex:0 0 32px; padding:0 8px 0 12px; background:var(--panel); border-bottom:1px solid var(--border); }
.codehead .title { font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-mut); cursor:pointer; }
.codehead .file, .codehead .cmd { font-family:var(--mono); font-size:10px; color:var(--ink-mut); }
.code pre { margin:0; padding:12px 14px; overflow:auto; flex:1; font-family:var(--mono); font-size:11px; line-height:1.55; color:var(--ink-2); white-space:pre; }

/* --- bottom panel --------------------------------------------------------- */
.panel { display:flex; flex-direction:column; min-height:0; background:var(--bg); border-top:1px solid var(--border); overflow:hidden; }
.panelhead { display:flex; align-items:center; gap:6px; height:38px; flex:0 0 38px; padding:0 8px; background:var(--panel); border-bottom:1px solid var(--border); }
.ptab { display:flex; align-items:center; gap:7px; height:24px; padding:0 11px; cursor:pointer; font-size:11.5px; font-weight:600; color:var(--ink-2); border-radius:4px; background:var(--btn-lift); box-shadow:var(--raised); }
.ptab:hover { filter:brightness(1.15); }
.ptab.on { color:var(--on-acc); background:var(--primary); box-shadow:var(--raised-strong); }
.ptab .badge { font-family:var(--mono); font-size:9.5px; color:var(--ink-2); background:var(--chip-bg); border-radius:999px; padding:1px 7px; }
.pbtn { height:24px; display:flex; align-items:center; padding:0 10px; cursor:pointer; color:var(--btn-ink); font-size:11px; border-radius:4px; background:var(--btn); border:1px solid var(--btn-edge2); box-shadow:0 1px 0 var(--hl-a) inset; }
.pbtn:hover { filter:brightness(1.2); }
.pbtn:active { transform:translateY(1px); }
.panelbody { flex:1; overflow-y:auto; min-height:0; }
.explain { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr); gap:10px; padding:12px; align-items:start; }
.col { padding:13px 15px; border-radius:9px; background:var(--panel); min-width:0; overflow-y:auto; }
.col h3 { font-size:10px; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--ink-mut); margin:0 0 10px; }
.col .sel { font-size:22px; color:var(--ink); margin-bottom:12px; overflow-x:auto; overflow-y:hidden; }
.col .kindname { font-size:12px; font-weight:600; color:var(--acc-hi); margin-bottom:6px; }
.col p { font-size:12px; line-height:1.6; color:var(--ink-2); margin:0; }
.trailrow { display:grid; grid-template-columns:20px minmax(0,1fr) auto; gap:9px; align-items:center; padding:4px 7px; border-radius:6px; }
.trailrow .no { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; font-family:var(--mono); font-size:9px; color:var(--ink-mut); background:var(--hov); }
.trailrow.on { background:var(--acc-soft-bg); }
.trailrow.on .no { color:var(--on-acc); background:var(--acc); }
.trailrow.weak { background:var(--hov); }
.trailrow .rel { justify-self:end; font-size:9.5px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink-mut); }
.trailrow.on .rel { color:var(--acc-hi); }
.trailrow .rule { font-size:12px; color:var(--ink-2); }
.trail { display:flex; flex-direction:column; gap:5px; margin-bottom:11px; }
.checkbadge { font-size:9.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--on-acc); border-radius:999px; padding:2px 8px; }
.checkbadge.verified { background:var(--ok); }
.checkbadge.conditional { background:var(--warn); }
.checkbadge.checked { background:transparent; color:var(--ok); border:1px solid var(--ok); }
.checkbadge.unverified { background:var(--ink-mut); }
.rulestat { display:grid; grid-template-columns:8px minmax(0,1fr); gap:6px 9px; align-items:baseline; padding:6px 0; font-size:11.5px; }
.rulestat .n { font-weight:600; color:var(--ink-2); }
.rulestat .note { grid-column:2; color:var(--ink-mut); font-size:11px; line-height:1.5; }
.rulestat .vmark { align-self:center; }
.hintbox { padding:15px 17px; font-size:12px; color:var(--ink-mut); max-width:80ch; line-height:1.6; }
.log { padding:10px 12px; display:flex; flex-direction:column; gap:4px; }
.logrow { display:grid; grid-template-columns:76px 68px minmax(0,1fr); gap:12px; padding:6px 11px; border-radius:7px; background:var(--panel); font-family:var(--mono); font-size:11px; }
.logrow .t { color:var(--ink-mut); }
.logrow .lv { font-weight:600; }
.logrow .lv.ok { color:var(--ok); }
.logrow .lv.err { color:var(--danger); }
.logrow .lv.rpc { color:var(--acc-hi); }
.logrow .msg { color:var(--ink-2); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* --- status bar ----------------------------------------------------------- */
.statusbar { display:flex; align-items:center; gap:14px; height:26px; flex:0 0 26px; padding:0 13px; background:var(--panel); border-top:1px solid var(--border); color:var(--ink-mut); font-family:var(--mono); font-size:10.5px; }
.statusbar .pipe { opacity:0.5; }
.statusbar .rules { color:var(--acc-hi); }

/* --- popups --------------------------------------------------------------- */
.comprow.symrow { display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; }
.comprow.symrow .sym { font-size:16px; color:var(--acc); padding-left:8px; }
.completions { position:fixed; z-index:70; width:330px; border-radius:6px; background:var(--panel-2); border:1px solid var(--bg); box-shadow:var(--pop); overflow:hidden; }
.comprow { display:grid; grid-template-columns:minmax(0,150px) minmax(0,1fr); gap:10px; align-items:baseline; padding:6px 10px; cursor:pointer; border-top:1px solid var(--panel); }
.comprow:first-child { border-top:0; }
.comprow.on { background:var(--acc-soft-bg3); }
.comprow .n { font-family:var(--mono); font-size:11.5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.comprow.on .n { color:var(--acc-hi); }
.comprow .h { font-size:10.5px; color:var(--ink-mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.compfoot { padding:4px 10px; font-size:9.5px; color:var(--ink-mut); background:var(--panel); border-top:1px solid var(--bg); }
.sighelp { position:fixed; z-index:60; max-width:560px; background:var(--panel-2); border:1px solid var(--bg); border-radius:8px; box-shadow:var(--pop); padding:7px 12px 8px; pointer-events:none; }
.sighelp .ss { font-family:var(--mono); font-size:12px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sighelp .ss b { color:var(--acc-hi); font-weight:700; }
.sighelp .sb { font-size:10.5px; color:var(--ink-mut); margin-top:3px; }
.hoverdoc { position:fixed; width:330px; z-index:60; background:var(--panel-2); border:1px solid var(--bg); border-radius:10px; box-shadow:var(--pop); padding:14px 16px; pointer-events:none; }
.hoverdoc .hn { font-size:13px; font-weight:700; }
.hoverdoc .hs { font-family:var(--mono); font-size:11px; color:var(--acc-hi); margin:8px 0; }
.hoverdoc .hb { font-size:12px; line-height:1.55; color:var(--ink-2); }
.toasts { position:fixed; right:16px; bottom:38px; z-index:80; display:flex; flex-direction:column; align-items:flex-end; gap:6px; pointer-events:none; }
.toast { max-width:min(440px, calc(100vw - 32px)); padding:8px 13px; border-radius:8px; font:12.5px/1.5 var(--font); color:var(--ink); background:var(--panel-2); border:1px solid var(--border); border-left:3px solid var(--ok); box-shadow:var(--pop); pointer-events:auto; cursor:default; animation:toast-in .15s ease-out; }
.toast.err { border-left-color:var(--danger-2); }
@keyframes toast-in { from { opacity:0; transform:translateY(6px); } }
/* --- phones and narrow windows --------------------------------------------- */
@media (max-width: 760px) {
  #app { height:100dvh; }
  .titlebar { gap:8px; padding:0 8px; }
  .brand .name, .themebtn, .kernel .sep, .kernel > :not(.dot), .formsel { display:none; }
  .kernel { padding:6px; }
  .menus { overflow-x:auto; scrollbar-width:none; min-width:0; flex:1; }
  .menus::-webkit-scrollbar { display:none; }
  .menus span { padding:5px 7px; }
  .menus .dropdown { position:fixed; top:40px; left:8px; right:auto; max-width:calc(100vw - 16px); }
  .spacer { flex:0 0 0; }
  .tabbar { overflow-x:auto; scrollbar-width:none; }
  .tab { flex:0 0 auto; padding:6px 10px 7px; }
  .body { position:relative; }
  .rail { width:38px; flex-basis:38px; }
  /* the sidebar is a drawer over the paper */
  .sidebar { position:absolute; left:38px; top:0; bottom:0; z-index:30; width:min(300px, 80vw); box-shadow:var(--pop); }
  .toolbar { overflow-x:auto; scrollbar-width:none; }
  .toolbar .hint, .toolbar .tlabel { display:none; }
  .notice { flex-wrap:wrap; }
  .cells { padding:12px 0 40px; }
  .cell, .outrow { grid-template-columns:46px minmax(0,1fr) 14px; }
  .cell { padding-right:6px; }
  .cell .prompt { padding-right:6px; font-size:9px; letter-spacing:0; }
  .brk { width:6px; }
  .gap::before { left:46px; right:14px; }
  /* no room beside the input: the active cell's actions sit under it */
  .cell:hover .cellin, .cell.active .cellin, .cell:hover .hl, .cell.active .hl { padding-right:8px; }
  .cellacts { position:static; grid-column:2; grid-row:2; margin:6px 0 0 8px; flex-wrap:wrap; }
  .cell:not(.active) .cellacts { display:none; }
  .mdin, .mdout { padding-right:8px; }
  .mdout { font-size:15.5px; }
  .sectrow { padding-right:0; }
  .sectin { font-size:18px; }
  .step, .step.sub { grid-template-columns:22px minmax(0,1fr); gap:6px 10px; }
  .step .el { grid-column:1 / -1; }
  .step.sub { margin-left:0 !important; }
  .explain { grid-template-columns:minmax(0,1fr); }
  .exrow { grid-template-columns:minmax(0,1fr); gap:0; }
  .exprompt { text-align:left; }
  /* the contents become a strip above the page */
  .docs { flex-direction:column; }
  .docnav { flex:0 0 auto; width:auto; border-right:0; border-bottom:1px solid var(--border); }
  .docsearch { margin:8px 10px 4px; }
  .doclist { display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; padding:0 8px 6px; }
  .docgroup, .docarea, .docrow.tree { display:none; }
  .docrow { flex:0 0 auto; white-space:nowrap; }
  .docpage { padding:16px 16px 40px; }
  .docfoot { flex-direction:column; }
  .statusbar { display:none; }
  .studio-top { flex-direction:column; }
  .shots { width:auto; flex:0 0 auto; max-height:35vh; }
  .toasts { left:16px; right:16px; bottom:16px; align-items:stretch; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  .leanbar.busy > div { width:100%; opacity:.45; animation:none; }
}
[hidden] { display:none !important; }
</style>
